name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64-apk:
    name: Build debug APK (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate local ISO code-generation helper
        run: |
          python3 -m py_compile scripts/prepare_sotc_android.py scripts/patch_ps2recomp_android_input.py scripts/patch_sotc_android_main.py
          python3 scripts/patch_ps2recomp_android_input.py --self-test
          python3 scripts/patch_sotc_android_main.py --self-test
          python3 scripts/prepare_sotc_android.py --check-source-tree --upstream upstream/sotc-vibe-pc

      - name: Audit upstream Android port blockers
        run: python3 scripts/android_port_audit.py --upstream upstream/sotc-vibe-pc --output build/ANDROID_PORT_AUDIT.md

      - name: Upload Android port audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-port-audit
          path: build/ANDROID_PORT_AUDIT.md
          if-no-files-found: warn
          retention-days: 30

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The hosted Ubuntu runner already contains Android command-line tools.
      # Avoid setup-android's deprecated "tools" package installation.
      - name: Install Android build packages
        shell: bash
        run: |
          set -eu
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug and optimized release APKs
        run: gradle --no-daemon --max-workers=1 --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Verify packaged native libraries
        shell: bash
        run: |
          set -eu
          for APK in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
            test -f "$APK"
            unzip -l "$APK" | grep -q 'lib/arm64-v8a/libsotc_android_touch.so'
            unzip -l "$APK" | grep -q 'lib/arm64-v8a/libps2EntryRunner.so'
          done
          echo "Debug and optimized release APKs both contain touch input and NativeActivity runtime libraries."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowColossusAndroid-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload optimized release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowColossusAndroid-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
