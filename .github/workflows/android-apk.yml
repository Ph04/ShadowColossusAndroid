name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64-apk:
    name: Build debug APK (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Validate Celosia USA migration helpers
        shell: bash
        run: |
          set -eu
          python3 -m py_compile \
            scripts/ensure_celosia.py \
            scripts/patch_celosia_android_input.py \
            scripts/patch_celosia_android_paths.py \
            scripts/patch_celosia_android_startup.py \
            scripts/prepare_celosia_android_source.py \
            scripts/prepare_celosia_android.py
          python3 scripts/ensure_celosia.py --self-test
          python3 scripts/patch_celosia_android_input.py --self-test
          python3 scripts/patch_celosia_android_paths.py --self-test
          python3 scripts/patch_celosia_android_startup.py --self-test
          python3 scripts/prepare_celosia_android.py --check-source-tree

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The hosted Ubuntu runner already contains Android command-line tools.
      # Avoid setup-android's deprecated "tools" package installation.
      - name: Install Android build packages
        shell: bash
        run: |
          set -eu
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug and release scaffold APKs (USA game code absent in clean CI)
        run: gradle --no-daemon --max-workers=1 --stacktrace :app:assembleDebug :app:assembleDiagnostic :app:assembleRelease

      - name: Verify packaged native libraries
        shell: bash
        run: |
          set -eu
          for APK in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/diagnostic/app-diagnostic.apk app/build/outputs/apk/release/app-release.apk; do
            test -f "$APK"
            unzip -l "$APK" | grep -q 'lib/arm64-v8a/libsotc_android_touch.so'
            unzip -l "$APK" | grep -q 'lib/arm64-v8a/libps2EntryRunner.so'
            unzip -l "$APK" | grep -q 'lib/arm64-v8a/libsotc_android_bridge.so'
          done
          echo "APK contains the Celosia Android runtime and touch/JNI bridges. A clean CI build is diagnostic, not a playable game."

      - name: Upload debug scaffold APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowColossusAndroid-celosia-usa-debug-scaffold
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload optimized release scaffold APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowColossusAndroid-celosia-usa-release-scaffold
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic scaffold APK
        uses: actions/upload-artifact@v4
        with:
          name: ShadowColossusAndroid-celosia-usa-diagnostic-scaffold
          path: app/build/outputs/apk/diagnostic/app-diagnostic.apk
          if-no-files-found: error
          retention-days: 14
